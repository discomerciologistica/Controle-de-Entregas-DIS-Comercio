<!DOCTYPE html>
<html>
<head>
  <title>Controle de Entregas</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: url('https://static.vecteezy.com/ti/vetor-gratis/p1/29246153-fundo-de-sistema-geometrico-e-de-conexao-de-tecnologia-de-alta-tecnologia-com-resumo-de-dados-digitais-vetor.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 12px;
    }

    button {
      padding: 8px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    .menu button {
      background: #333;
      color: white;
      margin-right: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th {
      background: #007bff;
      color: white;
    }

    td, th {
      padding: 6px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .status-respondido { background: green; color: white; }
    .status-pendente { background: red; color: white; }

  </style>
</head>

<body>

<div class="container">

<h2>🚚 Controle de Entregas</h2>

<div class="menu">
  <button onclick="trocarAba('atuais')">Pedidos Atuais</button>
  <button onclick="trocarAba('anteriores')">Pedidos Anteriores</button>
</div>

<br>

<table id="tabela">
<thead>
<tr>
<th>Pedido</th>
<th>NF</th>
<th>Status</th>
<th>Atraso?</th>
<th>Motivo</th>
<th>Ação</th>
</tr>
</thead>
<tbody></tbody>
</table>

<table id="tabelaAnteriores" style="display:none;">
<thead>
<tr>
<th>Pedido</th>
<th>NF</th>
<th>Atraso?</th>
<th>Motivo</th>
<th>Data Resp</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwI4rXeSdViPoPqPgrQqDfBt5dbFmfo1oCeP3VPv-K0b7WelVm0xpDcfIl3yNguK5OL/exec";

function trocarAba(tipo) {
  document.getElementById("tabela").style.display = tipo === "atuais" ? "table" : "none";
  document.getElementById("tabelaAnteriores").style.display = tipo === "anteriores" ? "table" : "none";
}

async function carregarDados() {

  const res = await fetch(API_URL);
  const json = await res.json();

  carregarAtual(json.dados);
  carregarAnteriores(json.anteriores);
}

function carregarAtual(dados) {

  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML = "";

  dados.slice(1).forEach(linha => {

    const status = linha[11] ? "RESPONDIDO" : "PENDENTE";

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${linha[0]}</td>
      <td>${linha[1]}</td>
      <td class="${status === 'RESPONDIDO' ? 'status-respondido' : 'status-pendente'}">${status}</td>
      <td><select><option>SIM</option><option>NAO</option></select></td>
      <td><input></td>
      <td><button onclick="salvar(this)">Salvar</button></td>
    `;

    tbody.appendChild(tr);
  });
}

function carregarAnteriores(dados) {

  const tbody = document.querySelector("#tabelaAnteriores tbody");
  tbody.innerHTML = "";

  dados.slice(1).forEach(linha => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${linha[0]}</td>
      <td>${linha[1]}</td>
      <td>${linha[11]}</td>
      <td>${linha[12]}</td>
      <td>${linha[13]}</td>
    `;

    tbody.appendChild(tr);
  });
}

async function salvar(btn) {

  const tr = btn.parentElement.parentElement;
  const tds = tr.querySelectorAll("td");

  const nf = tds[1].innerText;
  const atraso = tds[3].querySelector("select").value;
  const motivo = tds[4].querySelector("input").value;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ nf, atraso, motivo })
  });

  alert("Salvo!");
  carregarDados();
}

carregarDados();

</script>

</body>
</html>
