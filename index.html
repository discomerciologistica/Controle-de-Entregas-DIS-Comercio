<!DOCTYPE html>
<html>
<head>
  <title>Controle de Entregas</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: url('https://static.vecteezy.com/ti/vetor-gratis/p1/29246153-fundo-de-sistema-geometrico-e-de-conexao-de-tecnologia-de-alta-tecnologia-com-resumo-de-dados-digitais-vetor.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .filtros button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }

    .btn-todos { background: #007bff; }
    .btn-pendente { background: #dc3545; }
    .btn-respondido { background: #28a745; }

    .ativo {
      box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
    }

    .cards {
      display: flex;
      gap: 15px;
      margin: 15px 0;
    }

    .card {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      background: white;
      color: black;
      text-align: center;
      font-weight: bold;
      border: 1px solid #ddd;
      font-size: 18px;
    }

    .numero-total {
      color: #007bff;
      font-size: 26px;
      font-weight: bold;
    }

    .numero-pendente {
      color: #dc3545;
      font-size: 26px;
      font-weight: bold;
    }

    .numero-respondido {
      color: #28a745;
      font-size: 26px;
      font-weight: bold;
    }

    .tabela-wrapper {
      overflow-x: auto;
      width: 100%;
      margin-top: 15px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    th {
      background: #007bff;
      color: white;
      padding: 8px;
      white-space: nowrap;
    }

    td {
      padding: 6px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      vertical-align: middle;
    }

    /* Coluna Motivo: quebra linha e largura mínima garantida */
    td.col-motivo {
      text-align: left;
      white-space: normal;
      word-break: break-word;
      min-width: 180px;
      max-width: 300px;
      line-height: 1.4;
    }

    td.col-motivo input {
      width: 100%;
      white-space: normal;
      word-break: break-word;
      box-sizing: border-box;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    tr:hover {
      background: #e9f3ff;
    }

    .status-respondido {
      background: #28a745;
      color: white;
      font-weight: bold;
    }

    .status-pendente {
      background: #dc3545;
      color: white;
      font-weight: bold;
    }

    select, input[type="text"], input:not([type]) {
      width: 100%;
    }

    .acoes {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-lote {
      background: #ff9800;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-importar {
      background: #6c757d;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-exportar {
      background: #17a2b8;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    tr.atraso-alto {
      background: #ffe5e5 !important;
    }

    tr.atraso-alto:hover {
      background: #ffcccc !important;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>🚚 Entregas Pendentes</h2>

  <div class="filtros">
    <button class="btn-todos ativo" onclick="filtrar('TODOS', this)">Todos</button>
    <button class="btn-pendente" onclick="filtrar('PENDENTE', this)">Pendentes</button>
    <button class="btn-respondido" onclick="filtrar('RESPONDIDO', this)">Respondidos</button>
  </div>

  <div class="cards">
    <div class="card total" id="totalCard">
      Todos: <span class="numero-total">0</span>
    </div>
    <div class="card pendente" id="pendenteCard">
      Pendentes: <span class="numero-pendente">0</span>
    </div>
    <div class="card respondido" id="respondidoCard">
      Respondidos: <span class="numero-respondido">0</span>
    </div>
  </div>

  <div class="acoes">
    <button class="btn-lote" onclick="salvarSelecionados()">
      💾 Salvar Selecionados
    </button>

    <input type="file" id="csvFile" accept=".csv">

    <button class="btn-importar" onclick="importarCSV()">
      📂 Importar CSV
    </button>

    <button class="btn-exportar" onclick="exportarExcel()">
      📊 Exportar Excel
    </button>
  </div>

  <div class="tabela-wrapper">
    <table id="tabela">
      <thead>
        <tr>
          <th><input type="checkbox" onclick="selecionarTodos(this)"></th>
          <th>Pedido</th>
          <th>NF</th>
          <th>Transp</th>
          <th>Cidade</th>
          <th>Coleta</th>
          <th>Previsão</th>
          <th>UF</th>
          <th>Atraso dias</th>
          <th>Status</th>
          <th>Agendado</th>
          <th>Em rota</th>
          <th>Status Resp</th>
          <th>Atraso?</th>
          <th>Motivo</th>
          <th>Data Resp</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwI4rXeSdViPoPqPgrQqDfBt5dbFmfo1oCeP3VPv-K0b7WelVm0xpDcfIl3yNguK5OL/exec";
let filtroAtual = "TODOS";

// Guarda os dados brutos para exportar com tudo
let dadosGlobais = [];

function formatarData(data) {
  if (!data || isNaN(new Date(data))) return data;
  const d = new Date(data);
  return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
}

function filtrar(tipo, btn) {
  filtroAtual = tipo;
  document.querySelectorAll(".filtros button")
    .forEach(b => b.classList.remove("ativo"));
  btn.classList.add("ativo");
  carregarDados();
}

function selecionarTodos(master) {
  document.querySelectorAll(".checkLinha")
    .forEach(c => c.checked = master.checked);
}

async function carregarDados() {
  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML = `
    <tr>
      <td colspan="17" style="text-align:center; padding: 30px; color: #888; font-size: 16px;">
        ⏳ Carregando dados...
      </td>
    </tr>
  `;

  const res = await fetch(API_URL);
  const dados = await res.json();

  // Salva os dados brutos globalmente para o exportar
  dadosGlobais = dados;

  tbody.innerHTML = "";

  let total = 0;
  let pendentes = 0;
  let respondidos = 0;

  dados.slice(1).forEach(linha => {
    const atrasoAtual = linha[11] || "";
    const motivoAtual = linha[12] || "";
    const dataResposta = linha[13] || "";
    const status = atrasoAtual ? "RESPONDIDO" : "PENDENTE";

    total++;
    if (status === "RESPONDIDO") { respondidos++; } else { pendentes++; }

    if (filtroAtual === "PENDENTE" && status !== "PENDENTE") return;
    if (filtroAtual === "RESPONDIDO" && status !== "RESPONDIDO") return;

    const tr = document.createElement("tr");
    const diasAtraso = parseInt(linha[7]) || 0;
    if (diasAtraso > 5) tr.classList.add("atraso-alto");

    tr.innerHTML = `
      <td><input type="checkbox" class="checkLinha"></td>
      <td>${linha[0]}</td>
      <td>${linha[1]}</td>
      <td>${linha[2]}</td>
      <td>${linha[3]}</td>
      <td>${formatarData(linha[4])}</td>
      <td>${formatarData(linha[5])}</td>
      <td>${linha[6]}</td>
      <td>${linha[7]}</td>
      <td>${linha[8]}</td>
      <td>${linha[9]}</td>
      <td>${formatarData(linha[10])}</td>
      <td class="${status === 'RESPONDIDO' ? 'status-respondido' : 'status-pendente'}">
        ${status}
      </td>
      <td>
        <select>
          <option value="">-</option>
          <option value="SIM" ${atrasoAtual === "SIM" ? "selected" : ""}>SIM</option>
          <option value="NAO" ${atrasoAtual === "NAO" ? "selected" : ""}>NÃO</option>
        </select>
      </td>
      <td class="col-motivo"><input value="${motivoAtual}" /></td>
      <td>${formatarData(dataResposta)}</td>
      <td><button onclick="salvar(this)">Salvar</button></td>
    `;

    tbody.appendChild(tr);
  });

  document.getElementById("totalCard").innerHTML =
    `Todos: <span class="numero-total">${total}</span>`;
  document.getElementById("pendenteCard").innerHTML =
    `Pendentes: <span class="numero-pendente">${pendentes}</span>`;
  document.getElementById("respondidoCard").innerHTML =
    `Respondidos: <span class="numero-respondido">${respondidos}</span>`;
}

async function salvar(btn) {
  const tr = btn.parentElement.parentElement;
  const tds = tr.querySelectorAll("td");
  const nf = tds[2].innerText;
  const atraso = tds[13].querySelector("select").value;
  const motivo = tds[14].querySelector("input").value;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ nf, atraso, motivo })
  });

  btn.textContent = "✅ Salvo!";
  btn.style.background = "#28a745";
  btn.style.color = "white";
  btn.disabled = true;

  setTimeout(() => {
    btn.textContent = "Salvar";
    btn.style.background = "";
    btn.style.color = "";
    btn.disabled = false;
    carregarDados();
  }, 2000);
}

async function salvarSelecionados() {
  const linhas = document.querySelectorAll("#tabela tbody tr");
  const lote = [];

  linhas.forEach(tr => {
    const check = tr.querySelector(".checkLinha");
    if (check && check.checked) {
      const tds = tr.querySelectorAll("td");
      const nf = tds[2].innerText;
      const atraso = tds[13].querySelector("select").value;
      const motivo = tds[14].querySelector("input").value;
      if (atraso) lote.push({ nf, atraso, motivo });
    }
  });

  if (lote.length === 0) {
    alert("Selecione pelo menos uma linha preenchida com Atraso!");
    return;
  }

  const btnLote = document.querySelector(".btn-lote");
  btnLote.textContent = "⏳ Salvando...";
  btnLote.disabled = true;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ lote })
  });

  btnLote.textContent = "✅ Lote Salvo!";
  btnLote.style.background = "#28a745";

  setTimeout(() => {
    btnLote.textContent = "💾 Salvar Selecionados";
    btnLote.style.background = "#ff9800";
    btnLote.disabled = false;
    carregarDados();
  }, 2000);
}

async function importarCSV() {
  const fileInput = document.getElementById("csvFile");

  if (!fileInput.files.length) {
    alert("Selecione um arquivo CSV primeiro!");
    return;
  }

  const senha = prompt("🔒 Digite a senha para importar:");
  if (!senha) return;

  const file = fileInput.files[0];

  const texto = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(file, "iso-8859-1");
  });

  const separador = texto.includes(";") ? ";" : ",";

  const linhas = texto
    .trim()
    .split("\n")
    .map(linha =>
      linha.split(separador).map(cel => cel.trim().replace(/\r/g, "").replace(/^"|"$/g, ""))
    );

  if (linhas.length < 2) {
    alert("CSV vazio ou sem dados!");
    return;
  }

  const confirmacao = confirm(
    `Importar ${linhas.length - 1} linha(s) do arquivo "${file.name}"?\n\nATENÇÃO: Isso substituirá todos os dados da aba!`
  );
  if (!confirmacao) return;

  const btnImportar = document.querySelector(".btn-importar");
  btnImportar.textContent = "⏳ Importando...";
  btnImportar.disabled = true;

  const resposta = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ importarCSV: true, senha: senha, linhas: linhas })
  });

  const resultado = await resposta.text();
  alert(resultado);

  btnImportar.textContent = "📂 Importar CSV";
  btnImportar.disabled = false;
  fileInput.value = "";

  if (resultado.includes("sucesso")) carregarDados();
}

function exportarExcel() {
  if (!dadosGlobais || dadosGlobais.length < 2) {
    alert("Nenhum dado carregado para exportar!");
    return;
  }

  // Cabeçalho igual ao da tabela (sem checkbox e sem coluna Ação)
  const cabecalho = [
    "Pedido", "NF", "Transp", "Cidade", "Coleta", "Previsão",
    "UF", "Atraso dias", "Status", "Agendado", "Em rota",
    "Status Resp", "Atraso?", "Motivo", "Data Resp"
  ];

  // Monta linhas: pega os dados brutos e calcula Status Resp igual à tela
  const linhas = dadosGlobais.slice(1).map(linha => {
    const atrasoAtual = linha[11] || "";
    const statusResp  = atrasoAtual ? "RESPONDIDO" : "PENDENTE";

    return [
      linha[0],                    // Pedido
      linha[1],                    // NF
      linha[2],                    // Transp
      linha[3],                    // Cidade
      formatarData(linha[4]),      // Coleta
      formatarData(linha[5]),      // Previsão
      linha[6],                    // UF
      linha[7],                    // Atraso dias
      linha[8],                    // Status
      linha[9],                    // Agendado
      formatarData(linha[10]),     // Em rota
      statusResp,                  // Status Resp
      linha[11] || "",             // Atraso?
      linha[12] || "",             // Motivo
      formatarData(linha[13])      // Data Resp
    ];
  });

  // Gera CSV com BOM UTF-8 para o Excel abrir com acentos corretos
  const todasLinhas = [cabecalho, ...linhas];
  const csv = todasLinhas
    .map(row =>
      row.map(cel => {
        const v = String(cel ?? "");
        // Envolve em aspas se tiver vírgula, aspas ou quebra de linha
        return v.includes(",") || v.includes('"') || v.includes("\n")
          ? `"${v.replace(/"/g, '""')}"`
          : v;
      }).join(";")
    )
    .join("\r\n");

  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const hoje = new Date();
  const dataHoje = `${String(hoje.getDate()).padStart(2,'0')}-${String(hoje.getMonth()+1).padStart(2,'0')}-${hoje.getFullYear()}`;

  link.href = url;
  link.download = `entregas_${dataHoje}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

carregarDados();

</script>

</body>
</html>
