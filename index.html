<!DOCTYPE html>
<html>
<head>
  <title>Controle de Entregas</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: url('https://static.vecteezy.com/ti/vetor-gratis/p1/29246153-fundo-de-sistema-geometrico-e-de-conexao-de-tecnologia-de-alta-tecnologia-com-resumo-de-dados-digitais-vetor.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      background: rgba(255,255,255,0.95);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .filtros button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }

    .btn-todos { background: #007bff; }
    .btn-pendente { background: #dc3545; }
    .btn-respondido { background: #28a745; }

    .ativo {
      box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
    }

    .cards {
      display: flex;
      gap: 15px;
      margin: 15px 0;
    }

    .card {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      background: white;
      color: black;
      text-align: center;
      font-weight: bold;
      border: 1px solid #ddd;
      font-size: 18px;
    }

    .numero-total {
      color: #007bff;
      font-size: 26px;
      font-weight: bold;
    }

    .numero-pendente {
      color: #dc3545;
      font-size: 26px;
      font-weight: bold;
    }

    .numero-respondido {
      color: #28a745;
      font-size: 26px;
      font-weight: bold;
    }

    .tabela-wrapper {
      overflow-x: auto;
      width: 100%;
      margin-top: 15px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    th {
      background: #007bff;
      color: white;
      padding: 8px;
      white-space: nowrap;
    }

    td {
      padding: 6px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      vertical-align: middle;
    }

    /* Coluna Motivo: quebra linha e largura mínima garantida */
    td.col-motivo {
      text-align: left;
      white-space: normal;
      word-break: break-word;
      min-width: 180px;
      max-width: 300px;
      line-height: 1.4;
    }

    td.col-motivo input {
      width: 100%;
      white-space: normal;
      word-break: break-word;
      box-sizing: border-box;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    tr:hover {
      background: #e9f3ff;
    }

    .status-respondido {
      background: #28a745;
      color: white;
      font-weight: bold;
    }

    .status-pendente {
      background: #dc3545;
      color: white;
      font-weight: bold;
    }

    select, input[type="text"], input:not([type]) {
      width: 100%;
    }

    .acoes {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .acoes-grupo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #f4f6f8;
      flex-wrap: wrap;
    }

    .acoes-grupo strong {
      font-size: 13px;
      color: #555;
      margin-right: 4px;
    }

    .btn-lote {
      background: #ff9800;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-importar {
      background: #6c757d;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-exportar {
      background: #17a2b8;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-modelo {
      background: #6f42c1;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-resp-lote {
      background: #20c997;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    tr.atraso-alto {
      background: #ffe5e5 !important;
    }

    tr.atraso-alto:hover {
      background: #ffcccc !important;
    }

    .btn-historico {
      background: #343a40;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: white;
      width: 90%;
      max-width: 900px;
      max-height: 85vh;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      margin: 0;
    }

    .modal-fechar {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-busca {
      margin-bottom: 12px;
    }

    .modal-busca input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .modal-tabela-wrapper {
      overflow-y: auto;
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    #tabelaHistorico th {
      position: sticky;
      top: 0;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>🚚 Entregas Pendentes</h2>

  <div class="filtros">
    <button class="btn-todos ativo" onclick="filtrar('TODOS', this)">Todos</button>
    <button class="btn-pendente" onclick="filtrar('PENDENTE', this)">Pendentes</button>
    <button class="btn-respondido" onclick="filtrar('RESPONDIDO', this)">Respondidos</button>
  </div>

  <div class="cards">
    <div class="card total" id="totalCard">
      Todos: <span class="numero-total">0</span>
    </div>
    <div class="card pendente" id="pendenteCard">
      Pendentes: <span class="numero-pendente">0</span>
    </div>
    <div class="card respondido" id="respondidoCard">
      Respondidos: <span class="numero-respondido">0</span>
    </div>
  </div>

  <!-- Fluxo para a TRANSPORTADORA responder em lote -->
  <div class="acoes-grupo">
    <strong>📨 Resposta em lote (transportadora):</strong>
    <button class="btn-modelo" onclick="exportarModeloTransportadora()">
      📥 Baixar modelo (NFs pendentes)
    </button>
    <input type="file" id="csvRespostas" accept=".csv">
    <button class="btn-resp-lote" onclick="importarRespostasTransportadora()">
      📤 Importar respostas preenchidas
    </button>
  </div>

  <!-- Ações internas / administrativas -->
  <div class="acoes">
    <button class="btn-lote" onclick="salvarSelecionados()">
      💾 Salvar selecionados (manual)
    </button>

    <input type="file" id="csvFile" accept=".csv">

    <button class="btn-importar" onclick="importarCSV()">
      📂 Importar planilha base (Admin)
    </button>

    <button class="btn-exportar" onclick="exportarExcel()">
      📊 Exportar tudo (Excel/CSV)
    </button>

    <button class="btn-historico" onclick="abrirHistorico()">
      📜 Ver Histórico
    </button>
  </div>

  <div class="tabela-wrapper">
    <table id="tabela">
      <thead>
        <tr>
          <th><input type="checkbox" onclick="selecionarTodos(this)"></th>
          <th>Pedido</th>
          <th>NF</th>
          <th>Transp</th>
          <th>Cidade</th>
          <th>Coleta</th>
          <th>Previsão</th>
          <th>UF</th>
          <th>Atraso dias</th>
          <th>Status</th>
          <th>Agendado</th>
          <th>Em rota</th>
          <th>Status Resp</th>
          <th>Motivo</th>
          <th>Data Resp</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<!-- Modal de Histórico -->
<div id="modalHistorico" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📜 Histórico de respostas</h3>
      <button class="modal-fechar" onclick="fecharHistorico()">Fechar ✕</button>
    </div>
    <div class="modal-busca">
      <input type="text" id="buscaHistorico" placeholder="Buscar por NF ou Pedido..." oninput="filtrarHistorico()">
    </div>
    <div class="modal-tabela-wrapper">
      <table id="tabelaHistorico">
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Pedido</th>
            <th>NF</th>
            <th>Motivo</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxiF4c_-nxjNZ-G7cOI4lQiBvIAa31w2MEAFY2U4AXUpWIRmUSHl7PGAVEMgp1QR3pgng/exec";
let filtroAtual = "TODOS";

// Faz fetch com um tempo limite: se o Apps Script não responder dentro
// do prazo, a Promise é rejeitada em vez de ficar pendente para sempre
// (isso é o que fazia o botão "Importando..." travar sem nenhum erro).
async function fetchComTimeout(url, options = {}, timeoutMs = 30000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timeoutId);
  }
}

function mensagemDeErro(err) {
  if (err.name === "AbortError") {
    return "tempo limite excedido — o Apps Script demorou demais para responder (planilha muito grande, ou o script pode estar aguardando reautorização depois de uma atualização de código).";
  }
  return err.message || String(err);
}

// Guarda os dados brutos para exportar com tudo
let dadosGlobais = [];

function formatarData(data) {
  if (!data || isNaN(new Date(data))) return data;
  const d = new Date(data);
  return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${d.getUTCFullYear()}`;
}

function filtrar(tipo, btn) {
  filtroAtual = tipo;
  document.querySelectorAll(".filtros button")
    .forEach(b => b.classList.remove("ativo"));
  btn.classList.add("ativo");
  carregarDados();
}

function selecionarTodos(master) {
  document.querySelectorAll(".checkLinha")
    .forEach(c => c.checked = master.checked);
}

async function carregarDados() {
  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML = `
    <tr>
      <td colspan="16" style="text-align:center; padding: 30px; color: #888; font-size: 16px;">
        ⏳ Carregando dados...
      </td>
    </tr>
  `;

  let dados;
  try {
    const res = await fetchComTimeout(API_URL, {}, 20000);
    dados = await res.json();
  } catch (err) {
    tbody.innerHTML = `
      <tr>
        <td colspan="16" style="text-align:center; padding: 30px; color: #dc3545; font-size: 15px;">
          ⚠️ Não foi possível carregar os dados (${mensagemDeErro(err)}).<br>
          <button onclick="carregarDados()" style="margin-top:10px; padding:8px 16px; cursor:pointer;">🔄 Tentar novamente</button>
        </td>
      </tr>
    `;
    return;
  }

  // Salva os dados brutos globalmente para o exportar
  dadosGlobais = dados;

  tbody.innerHTML = "";

  let total = 0;
  let pendentes = 0;
  let respondidos = 0;

  dados.slice(1).forEach(linha => {
    // Coluna "Atraso?" (índice 11) foi descontinuada.
    // Status agora depende só de o Motivo estar preenchido.
    const motivoAtual = linha[12] || "";
    const dataResposta = linha[13] || "";
    const status = motivoAtual.trim() ? "RESPONDIDO" : "PENDENTE";

    total++;
    if (status === "RESPONDIDO") { respondidos++; } else { pendentes++; }

    if (filtroAtual === "PENDENTE" && status !== "PENDENTE") return;
    if (filtroAtual === "RESPONDIDO" && status !== "RESPONDIDO") return;

    const tr = document.createElement("tr");
    const diasAtraso = parseInt(linha[7]) || 0;
    if (diasAtraso > 5) tr.classList.add("atraso-alto");

    tr.innerHTML = `
      <td><input type="checkbox" class="checkLinha"></td>
      <td>${linha[0]}</td>
      <td>${linha[1]}</td>
      <td>${linha[2]}</td>
      <td>${linha[3]}</td>
      <td>${formatarData(linha[4])}</td>
      <td>${formatarData(linha[5])}</td>
      <td>${linha[6]}</td>
      <td>${linha[7]}</td>
      <td>${linha[8]}</td>
      <td>${linha[9]}</td>
      <td>${formatarData(linha[10])}</td>
      <td class="${status === 'RESPONDIDO' ? 'status-respondido' : 'status-pendente'}">
        ${status}
      </td>
      <td class="col-motivo"><input value="${motivoAtual}" /></td>
      <td>${formatarData(dataResposta)}</td>
      <td><button onclick="salvar(this)">Salvar</button></td>
    `;

    tbody.appendChild(tr);
  });

  document.getElementById("totalCard").innerHTML =
    `Todos: <span class="numero-total">${total}</span>`;
  document.getElementById("pendenteCard").innerHTML =
    `Pendentes: <span class="numero-pendente">${pendentes}</span>`;
  document.getElementById("respondidoCard").innerHTML =
    `Respondidos: <span class="numero-respondido">${respondidos}</span>`;
}

async function salvar(btn) {
  const tr = btn.parentElement.parentElement;
  const tds = tr.querySelectorAll("td");
  const nf = tds[2].innerText;
  const motivo = tds[13].querySelector("input").value;

  btn.textContent = "⏳ Salvando...";
  btn.disabled = true;

  try {
    await fetchComTimeout(API_URL, {
      method: "POST",
      body: JSON.stringify({ nf, motivo })
    }, 30000);

    btn.textContent = "✅ Salvo!";
    btn.style.background = "#28a745";
    btn.style.color = "white";

    setTimeout(() => {
      btn.textContent = "Salvar";
      btn.style.background = "";
      btn.style.color = "";
      btn.disabled = false;
      carregarDados();
    }, 2000);
  } catch (err) {
    alert("❌ Erro ao salvar: " + mensagemDeErro(err));
    btn.textContent = "Salvar";
    btn.style.background = "";
    btn.style.color = "";
    btn.disabled = false;
  }
}

async function salvarSelecionados() {
  const linhas = document.querySelectorAll("#tabela tbody tr");
  const lote = [];

  linhas.forEach(tr => {
    const check = tr.querySelector(".checkLinha");
    if (check && check.checked) {
      const tds = tr.querySelectorAll("td");
      const nf = tds[2].innerText;
      const motivo = tds[13].querySelector("input").value;
      if (motivo && motivo.trim()) lote.push({ nf, motivo });
    }
  });

  if (lote.length === 0) {
    alert("Selecione pelo menos uma linha com o Motivo preenchido!");
    return;
  }

  const btnLote = document.querySelector(".btn-lote");
  btnLote.textContent = "⏳ Salvando...";
  btnLote.disabled = true;

  try {
    await fetchComTimeout(API_URL, {
      method: "POST",
      body: JSON.stringify({ lote })
    }, 30000);

    btnLote.textContent = "✅ Lote Salvo!";
    btnLote.style.background = "#28a745";

    setTimeout(() => {
      btnLote.textContent = "💾 Salvar selecionados (manual)";
      btnLote.style.background = "#ff9800";
      btnLote.disabled = false;
      carregarDados();
    }, 2000);
  } catch (err) {
    alert("❌ Erro ao salvar lote: " + mensagemDeErro(err));
    btnLote.textContent = "💾 Salvar selecionados (manual)";
    btnLote.style.background = "#ff9800";
    btnLote.disabled = false;
  }
}

// ═══════════════════════════════════════
// Utilitário: parse de CSV (usado tanto no
// import admin quanto no import de respostas)
// ═══════════════════════════════════════
async function lerCSV(file) {
  const texto = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(file, "iso-8859-1");
  });

  const separador = texto.includes(";") ? ";" : ",";

  return texto
    .trim()
    .split("\n")
    .map(linha =>
      linha.split(separador).map(cel => cel.trim().replace(/\r/g, "").replace(/^"|"$/g, ""))
    );
}

// ═══════════════════════════════════════
// Modelo para a transportadora: exporta só
// NF + Motivo (vazio) das NFs pendentes
// ═══════════════════════════════════════
function exportarModeloTransportadora() {
  if (!dadosGlobais || dadosGlobais.length < 2) {
    alert("Nenhum dado carregado para gerar o modelo!");
    return;
  }

  const pendentes = dadosGlobais.slice(1).filter(linha => {
    const motivoAtual = linha[12] || "";
    return !motivoAtual.trim();
  });

  if (pendentes.length === 0) {
    alert("Não há NFs pendentes no momento!");
    return;
  }

  const cabecalho = ["NF", "Motivo"];
  const linhas = pendentes.map(linha => [linha[1], ""]);

  const todasLinhas = [cabecalho, ...linhas];
  const csv = todasLinhas
    .map(row => row.map(cel => {
      const v = String(cel ?? "");
      return v.includes(";") || v.includes('"') || v.includes("\n")
        ? `"${v.replace(/"/g, '""')}"`
        : v;
    }).join(";"))
    .join("\r\n");

  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const hoje = new Date();
  const dataHoje = `${String(hoje.getDate()).padStart(2,'0')}-${String(hoje.getMonth()+1).padStart(2,'0')}-${hoje.getFullYear()}`;

  link.href = url;
  link.download = `modelo_transportadora_${dataHoje}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════
// Importa o arquivo que a transportadora
// preencheu (NF + Motivo) e salva em lote
// ═══════════════════════════════════════
async function importarRespostasTransportadora() {
  const fileInput = document.getElementById("csvRespostas");

  if (!fileInput.files.length) {
    alert("Selecione o arquivo preenchido pela transportadora primeiro!");
    return;
  }

  const linhas = await lerCSV(fileInput.files[0]);

  if (linhas.length < 2) {
    alert("Arquivo vazio ou sem dados!");
    return;
  }

  // Detecta as colunas NF e Motivo pelo cabeçalho (não depende da ordem)
  const cabecalho = linhas[0].map(c => c.toLowerCase());
  const idxNf = cabecalho.findIndex(c => c.includes("nf"));
  const idxMotivo = cabecalho.findIndex(c => c.includes("motivo"));

  if (idxNf === -1 || idxMotivo === -1) {
    alert("Não encontrei as colunas 'NF' e 'Motivo' no cabeçalho do arquivo.");
    return;
  }

  const respostas = linhas.slice(1)
    .map(linha => ({ nf: linha[idxNf], motivo: linha[idxMotivo] }))
    .filter(r => r.nf && r.motivo && r.motivo.trim());

  if (respostas.length === 0) {
    alert("Nenhuma linha com Motivo preenchido foi encontrada no arquivo.");
    return;
  }

  const confirmacao = confirm(`Importar ${respostas.length} resposta(s) da transportadora?`);
  if (!confirmacao) return;

  const btn = document.querySelector(".btn-resp-lote");
  btn.textContent = "⏳ Importando...";
  btn.disabled = true;

  try {
    const resposta = await fetchComTimeout(API_URL, {
      method: "POST",
      body: JSON.stringify({ responderLote: true, respostas })
    }, 60000);

    const resultado = await resposta.text();
    alert(resultado);
    carregarDados();
  } catch (err) {
    alert("❌ Erro ao importar respostas: " + mensagemDeErro(err));
  } finally {
    btn.textContent = "📤 Importar respostas preenchidas";
    btn.disabled = false;
    fileInput.value = "";
  }
}

async function importarCSV() {
  const fileInput = document.getElementById("csvFile");

  if (!fileInput.files.length) {
    alert("Selecione um arquivo CSV primeiro!");
    return;
  }

  const senha = prompt("🔒 Digite a senha para importar:");
  if (!senha) return;

  const linhas = await lerCSV(fileInput.files[0]);

  if (linhas.length < 2) {
    alert("CSV vazio ou sem dados!");
    return;
  }

  const confirmacao = confirm(
    `Importar ${linhas.length - 1} linha(s) do arquivo "${fileInput.files[0].name}"?\n\nATENÇÃO: Isso substituirá todos os dados da aba!`
  );
  if (!confirmacao) return;

  const btnImportar = document.querySelector(".btn-importar");
  btnImportar.textContent = "⏳ Importando...";
  btnImportar.disabled = true;

  try {
    const resposta = await fetchComTimeout(API_URL, {
      method: "POST",
      body: JSON.stringify({ importarCSV: true, senha: senha, linhas: linhas })
    }, 60000);

    const resultado = await resposta.text();
    alert(resultado);

    if (resultado.includes("sucesso")) carregarDados();
  } catch (err) {
    alert("❌ Erro ao importar: " + mensagemDeErro(err));
  } finally {
    btnImportar.textContent = "📂 Importar planilha base (Admin)";
    btnImportar.disabled = false;
    fileInput.value = "";
  }
}

function exportarExcel() {
  if (!dadosGlobais || dadosGlobais.length < 2) {
    alert("Nenhum dado carregado para exportar!");
    return;
  }

  // Cabeçalho igual ao da tabela (sem checkbox e sem coluna Ação)
  const cabecalho = [
    "Pedido", "NF", "Transp", "Cidade", "Coleta", "Previsão",
    "UF", "Atraso dias", "Status", "Agendado", "Em rota",
    "Status Resp", "Motivo", "Data Resp"
  ];

  // Monta linhas: pega os dados brutos e calcula Status Resp igual à tela
  const linhas = dadosGlobais.slice(1).map(linha => {
    const motivoAtual = linha[12] || "";
    const statusResp = motivoAtual.trim() ? "RESPONDIDO" : "PENDENTE";

    return [
      linha[0],                    // Pedido
      linha[1],                    // NF
      linha[2],                    // Transp
      linha[3],                    // Cidade
      formatarData(linha[4]),      // Coleta
      formatarData(linha[5]),      // Previsão
      linha[6],                    // UF
      linha[7],                    // Atraso dias
      linha[8],                    // Status
      linha[9],                    // Agendado
      formatarData(linha[10]),     // Em rota
      statusResp,                  // Status Resp
      motivoAtual,                 // Motivo
      formatarData(linha[13])      // Data Resp
    ];
  });

  // Gera CSV com BOM UTF-8 para o Excel abrir com acentos corretos
  const todasLinhas = [cabecalho, ...linhas];
  const csv = todasLinhas
    .map(row =>
      row.map(cel => {
        const v = String(cel ?? "");
        // Envolve em aspas se tiver vírgula, aspas ou quebra de linha
        return v.includes(",") || v.includes('"') || v.includes("\n")
          ? `"${v.replace(/"/g, '""')}"`
          : v;
      }).join(";")
    )
    .join("\r\n");

  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const link = document.createElement("a");

  const hoje = new Date();
  const dataHoje = `${String(hoje.getDate()).padStart(2,'0')}-${String(hoje.getMonth()+1).padStart(2,'0')}-${hoje.getFullYear()}`;

  link.href = url;
  link.download = `entregas_${dataHoje}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════
// Modal de Histórico
// ═══════════════════════════════════════
let historicoGlobal = [];

function formatarDataHora(valor) {
  // Data/Hora já vem formatada como texto do Apps Script (dd/MM/yyyy HH:mm:ss)
  return valor || "";
}

async function abrirHistorico() {
  const modal = document.getElementById("modalHistorico");
  const tbody = document.querySelector("#tabelaHistorico tbody");

  modal.style.display = "flex";
  tbody.innerHTML = `
    <tr><td colspan="4" style="text-align:center; padding:20px; color:#888;">⏳ Carregando histórico...</td></tr>
  `;

  try {
    const res = await fetchComTimeout(`${API_URL}?historico=true`, {}, 20000);
    const dados = await res.json();

    // Ignora o cabeçalho e ordena do mais recente para o mais antigo
    historicoGlobal = dados.slice(1).reverse();

    renderizarHistorico(historicoGlobal);
  } catch (err) {
    tbody.innerHTML = `
      <tr><td colspan="4" style="text-align:center; padding:20px; color:#dc3545;">
        ⚠️ Erro ao carregar histórico (${mensagemDeErro(err)}).<br>
        <button onclick="abrirHistorico()" style="margin-top:10px; padding:6px 14px; cursor:pointer;">🔄 Tentar novamente</button>
      </td></tr>
    `;
  }
}

function renderizarHistorico(linhas) {
  const tbody = document.querySelector("#tabelaHistorico tbody");

  if (linhas.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="4" style="text-align:center; padding:20px; color:#888;">Nenhum registro encontrado.</td></tr>
    `;
    return;
  }

  tbody.innerHTML = linhas.map(linha => `
    <tr>
      <td>${formatarDataHora(linha[0])}</td>
      <td>${linha[1]}</td>
      <td>${linha[2]}</td>
      <td style="text-align:left;">${linha[3]}</td>
    </tr>
  `).join("");
}

function filtrarHistorico() {
  const termo = document.getElementById("buscaHistorico").value.trim().toLowerCase();

  if (!termo) {
    renderizarHistorico(historicoGlobal);
    return;
  }

  const filtrado = historicoGlobal.filter(linha =>
    String(linha[1]).toLowerCase().includes(termo) ||
    String(linha[2]).toLowerCase().includes(termo)
  );

  renderizarHistorico(filtrado);
}

function fecharHistorico() {
  document.getElementById("modalHistorico").style.display = "none";
  document.getElementById("buscaHistorico").value = "";
}

carregarDados();

</script>
